name: ResortPass
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.resortpass.interview
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  ResortPass:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "project.yml"
          - "*.md"
          - ".swiftpm"
          - ".xcodeproj"
    dependencies:
      - package: Kingfisher
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIAppFonts: "PlayfairDisplay.ttf,PlayfairDisplay-Italic.ttf"
  ResortPassTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ResortPass
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ResortPass.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ResortPass"
packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 8.0.0
schemes:
  ResortPass:
    shared: true
    gatherCoverageData: true
    build:
      targets:
        ResortPass: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ResortPassTests
      gatherCoverageData: true
