appId: com.resortpass.interview.ResortPass
name: Dark mode screenshot capture (loaded + hotels)
tags:
  - recording
---
- launchApp:
    clearState: true

- assertVisible: "Day Passes"
- tapOn: "Search cities, hotels…"
- inputText: "newport"

- extendedWaitUntil:
    visible: "Newport Beach, California"
    timeout: 5000
- takeScreenshot: 02-loaded-dark

- tapOn: "Newport Beach, California"

- extendedWaitUntil:
    visible: "Newport Beach, California"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-hotels-dark
