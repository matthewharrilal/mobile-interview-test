appId: com.resortpass.interview.ResortPass
name: Happy path — search → tap → see hotels → back
tags:
  - happy-path
# device: iPhone 17 Pro
# Contains one unavoidable coord-tap (5%, 8%) on the system nav-bar back
# chevron — the SwiftUI default back button has no custom accessibilityIdentifier
# we can target. Follow-up: add a custom toolbar back button with an
# accessibilityIdentifier (e.g. "back-button") so this can be replaced.
---
- launchApp:
    clearState: true

- assertVisible: "Day Passes"
- assertVisible: "Where are you headed?"
- assertVisible: "Search cities, hotels…"

- tapOn: "Search cities, hotels…"
- inputText: "newport"

- extendedWaitUntil:
    visible: "Newport Beach, California"
    timeout: 5000
- takeScreenshot: 01-search-loaded

- tapOn: "Newport Beach, California"

# Hotels nav title visible — push happened
- extendedWaitUntil:
    visible: "Newport Beach, California"
    timeout: 5000

# Wait long enough for hotels API to respond, then screenshot.
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-hotels-loaded

# Coord-tap on the system nav-bar back chevron. Unavoidable: SwiftUI's
# default back button has no settable accessibilityIdentifier. Calibrated
# against iPhone 17 Pro — see header `# device:` marker.
- tapOn:
    point: "5%, 8%"

# Back to search — query is preserved, results still visible
- assertVisible: "Day Passes"
- assertVisible: "Newport Beach, California"
- takeScreenshot: 01-back-on-search
