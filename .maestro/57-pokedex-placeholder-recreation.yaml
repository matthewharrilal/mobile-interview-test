appId: com.resortpass.interview.ResortPass
name: Pokédex placeholder bug recreation — Search nav title leak (Strings.swift:13)
tags:
  - bug
  - placeholder
  - search
  - nav-title
---
# P0 — recreates the Pokédex defaultValue leak on the Search nav bar.
# Source spec: 04-combo-matrix.md §5.9 flow 57.
# String literal references: Strings.swift:13 (search.navTitle defaultValue "Pokédex"),
# HotelListingsView.swift:85 (location.name as nav title on Listings).
- launchApp:
    clearState: true

# Bug surface: idle Search shows "Pokédex" instead of a brand title.
- assertVisible: "Pokédex"
- assertVisible: "Where are you headed?"
- takeScreenshot: 57-pokedex-search-nav

# Drive into Listings — confirm the nav title swaps to location.name (proves
# the title binding is correct downstream and the leak is isolated to Search).
- tapOn: "Search cities, hotels…"
- inputText: "newport"
- extendedWaitUntil:
    visible: "Newport Beach, California"
    timeout: 5000

- tapOn: "Newport Beach, California"
- extendedWaitUntil:
    visible: "Newport Beach, California"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 57-pokedex-listings-nav
