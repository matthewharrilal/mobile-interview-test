appId: com.resortpass.interview.ResortPass
name: Dark — Search failed (S5) "Couldn't search" + Try Again in dark
tags:
  - theme
  - dark
  - search
  - error
  - manual-launch
# Source spec: team-audit/reports/04-combo-matrix.md §5.5 flow 35
#
# REQUIRES SCRIPT: -ui-test-fail-search YES launch arg + dark appearance prelude.
# DARK-MODE ORCHESTRATION (per matrix §7.2):
#   xcrun simctl ui ${SIMID:-booted} appearance dark
# App must be pre-launched with the failure flag externally:
#   xcrun simctl launch <udid> com.resortpass.interview.ResortPass -ui-test-fail-search YES
# Maestro drives the running instance from here (no launchApp).
#
# Run via: bash scripts/run-failure-flows.sh 35-dark-search-failed
---
- tapOn: "Search cities, hotels…"
- inputText: "newport"
- extendedWaitUntil:
    visible: "Couldn't search"
    timeout: 5000
- assertVisible: "Try Again"
- takeScreenshot: 35-dark-search-failed
