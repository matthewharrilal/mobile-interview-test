appId: com.resortpass.interview.ResortPass
name: Search retry — Try Again recovers when failure auto-clears after first call
tags:
  - states
  - recovery
  - search
  - retry
  - manual-launch
---
# Run via: bash scripts/run-failure-flows.sh
# (orchestrates -ui-test-fail-search YES -ui-test-toggle-recovery-on-retry YES launch args)
#
# RECOVERY-PATH: with the toggle-recovery flag set, SearchClient is wired to
# .failingThenRecovers — first call throws, subsequent calls succeed. Tapping
# Try Again re-fires startSearch and exits the failed state.

- tapOn: "Search cities, hotels…"
- inputText: "newport"

- extendedWaitUntil:
    visible: "Couldn't search"
    timeout: 5000
- assertVisible: "Try Again"
- takeScreenshot: 28-search-retry-pre

- tapOn: "Try Again"

# Retry succeeds — failed UI clears, results render.
- extendedWaitUntil:
    visible: "Newport Beach, California"
    timeout: 5000
- takeScreenshot: 28-search-retry-recovered
