appId: com.resortpass.interview.ResortPass
name: Search retry — tapping Try Again with flag still set re-fails
tags:
  - states
  - error
  - search
  - retry
  - manual-launch
---
# Run via: bash scripts/run-failure-flows.sh
# (orchestrates -ui-test-fail-search YES launch arg)
#
# GAP-DOCUMENTING: Per spec — tapping Try Again while the failure flag is
# still active will re-fire startSearch and re-fail. There is no way to
# remove the flag mid-session without process restart, so this flow
# documents the retry-loop behavior rather than asserting recovery.

- tapOn: "Search cities, hotels…"
- inputText: "newport"

- extendedWaitUntil:
    visible: "Couldn't search"
    timeout: 5000
- assertVisible: "Try Again"
- takeScreenshot: 28-search-retry-pre

- tapOn: "Try Again"

# Briefly loading, then re-fails (flag still active)
- extendedWaitUntil:
    visible: "Couldn't search"
    timeout: 5000
- assertVisible: "Try Again"
- takeScreenshot: 28-search-retry-still-failed
