appId: com.resortpass.interview.ResortPass
name: Dynamic Type xxLarge — Search failed reflow + Try Again truncation check
tags:
  - dynamic-type
  - xxLarge
  - search
  - error
  - manual-launch
# Source spec: team-audit/reports/04-combo-matrix.md §5.6 flow 46
#
# REQUIRES SCRIPT: -ui-test-fail-search YES launch arg + DT xxLarge launch arg.
# App must be pre-launched with BOTH arguments externally:
#   xcrun simctl launch <udid> com.resortpass.interview.ResortPass \
#       -ui-test-fail-search YES \
#       -UIPreferredContentSizeCategoryName UICTContentSizeCategoryXXL
# Maestro drives the running instance from here (no launchApp).
#
# Verify Strings.Search.failedNetwork (Sources/Strings/Strings.swift:20)
# does not truncate at xxLarge.
#
# Run via: bash scripts/run-failure-flows.sh 46-xxlarge-failed-state
---
- tapOn: "Search cities, hotels…"
- inputText: "newport"
- extendedWaitUntil:
    visible: "Couldn't search"
    timeout: 5000
- assertVisible: "Try Again"
- takeScreenshot: 46-xxl-search-failed
