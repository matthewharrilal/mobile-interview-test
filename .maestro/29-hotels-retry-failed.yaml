appId: com.resortpass.interview.ResortPass
name: Hotels retry — Try Again recovers when failure auto-clears after first call
tags:
  - states
  - recovery
  - hotels
  - retry
  - manual-launch
---
# Run via: bash scripts/run-failure-flows.sh
# (orchestrates -ui-test-fail-hotels YES -ui-test-toggle-recovery-on-retry YES launch args)
#
# RECOVERY-PATH: with the toggle-recovery flag set, HotelsClient is wired to
# .failingThenRecovers — first call throws, subsequent calls succeed. Tapping
# Try Again re-fires the load and the listings render.

- tapOn: "Search cities, hotels…"
- inputText: "newport"

- extendedWaitUntil:
    visible: "Newport Beach, California"
    timeout: 5000
- tapOn: "Newport Beach, California"

- extendedWaitUntil:
    visible: "Couldn't load hotels"
    timeout: 8000
- assertVisible: "Try Again"
- takeScreenshot: 29-hotels-retry-pre

- tapOn: "Try Again"

# Retry succeeds — failed UI clears, hotels render.
- extendedWaitUntil:
    visible: "TWA Hotel"
    timeout: 8000
- takeScreenshot: 29-hotels-retry-recovered
