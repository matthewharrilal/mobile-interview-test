appId: com.resortpass.interview.ResortPass
name: Dark — Search idle (S1) renders dark Theme tokens
tags:
  - theme
  - dark
  - search
  - idle
# Source spec: team-audit/reports/04-combo-matrix.md §5.5 flow 32
#
# DARK-MODE ORCHESTRATION (per matrix §7.2):
# Maestro 0.15 runScript executes JS, not shell, so the simctl appearance
# command must run from the runner BEFORE this flow launches the app.
# Required runner-level prelude:
#   xcrun simctl ui ${SIMID:-booted} appearance dark
# After flow exits, clearState on next launch resets per-app state but the
# system-level dark appearance persists; runner should reset with
#   xcrun simctl ui ${SIMID:-booted} appearance light
# at the end of the dark-mode batch.
#
# Run via: bash scripts/run-failure-flows.sh 32-dark-search-idle
# (no -ui-test-* flag required for this flow — only the appearance prelude)
---
- launchApp:
    clearState: true

- assertVisible: "Pokédex"
- assertVisible: "Where are you headed?"
- assertVisible: "Search cities, hotels…"
- takeScreenshot: 32-dark-search-idle
