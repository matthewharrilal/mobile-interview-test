appId: com.resortpass.interview.ResortPass
name: Dark — HotelDetailScene (S12) detail expanded in dark
tags:
  - theme
  - dark
  - hotels
  - detail
# device: iPhone 17 Pro
# Contains an unavoidable coord-tap (30%, 45%) on a Top picks card.
# CompactHotelCard exposes no per-card accessibilityIdentifier. Follow-up:
# add accessibilityIdentifier "hotel-card-\(hotel.id)" on CompactHotelCard.
#
# Source spec: team-audit/reports/04-combo-matrix.md §5.5 flow 40
#
# DARK-MODE ORCHESTRATION (per matrix §7.2):
#   xcrun simctl ui ${SIMID:-booted} appearance dark
# Run via: bash scripts/run-failure-flows.sh 40-dark-detail-expanded
---
- launchApp:
    clearState: true

- tapOn: "Search cities, hotels…"
- inputText: "newport"
- extendedWaitUntil:
    visible: "Newport Beach, California"
    timeout: 5000
- tapOn: "Newport Beach, California"

- extendedWaitUntil:
    visible: "Top picks"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 4000

# Tap a card → matched-geom expansion to HotelDetailScene. Unavoidable
# coord-tap — see header `# device:` marker.
- tapOn:
    point: "30%, 45%"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 40-dark-detail-expanded
