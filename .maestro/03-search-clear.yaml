appId: com.resortpass.interview.ResortPass
name: Search clear button returns to idle state
tags:
  - states
  - search
---
- launchApp:
    clearState: true

- tapOn: "Search cities, hotels…"
- inputText: "newport"
- extendedWaitUntil:
    visible: "Newport Beach, California"
    timeout: 5000

# Tap the clear (X) button by accessibility label — device-agnostic.
# Matches `accessibilityLabel(Strings.Accessibility.clearSearch)` on the
# clear button in SearchView.swift:56.
- tapOn: "Clear search"

# Should return to idle state
- assertVisible: "Where are you headed?"
- takeScreenshot: 03-search-cleared-to-idle
