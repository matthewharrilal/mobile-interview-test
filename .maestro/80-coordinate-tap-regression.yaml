appId: com.resortpass.interview.ResortPass
name: Coordinate-tap regression — back chevron at 5%, 8% (iPhone 17 Pro calibration)
tags:
  - regression
  - coordinate-fragility
  - listings
# device: iPhone 17 Pro
# Intentional coord-tap regression — this flow asserts that 5%, 8% lands on
# the nav-bar back chevron under iPhone 17 Pro / iOS 26.4 calibration. It is
# expected to fail on other form factors (iPad, smaller iPhones); that is
# the whole point. Do not "fix" by replacing with a semantic selector.
---
# P1 — verifies the coord-tap calibration to iPhone 17 Pro / iOS 26.4
# (per scripts/run-failure-flows.sh:9). If this flow fails, every existing
# flow that uses tapOn point: "5%, 8%" needs recalibration.
# This flow is intentionally authored to capture brittleness, not pass on
# arbitrary devices.
# Source spec: 04-combo-matrix.md §5.14 flow 80.
- launchApp:
    clearState: true

- tapOn: "Search cities, hotels…"
- inputText: "newport"
- extendedWaitUntil:
    visible: "Newport Beach, California"
    timeout: 5000
- tapOn: "Newport Beach, California"
- extendedWaitUntil:
    visible: "Top picks"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 4000

# Coordinate-based back-chevron tap (mirrors flow 01 step 13).
- tapOn:
    point: "5%, 8%"
- waitForAnimationToEnd:
    timeout: 1500

# Back on Search — Day Passes nav title visible iff coord landed on the chevron.
# If "Day Passes" is NOT visible, calibration has drifted.
- assertVisible: "Day Passes"
- takeScreenshot: 80-coord-back-confirmed
