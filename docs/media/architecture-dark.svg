<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif">
  <defs>
    <marker id="arrow-d" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 z" fill="#ededed"/>
    </marker>
    <marker id="arrow-blue-d" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-back-d" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="960" height="460" fill="#0a0a0a"/>

  <text x="80"  y="38" fill="#666" font-size="11" letter-spacing="2">PRESENTATION</text>
  <text x="400" y="38" fill="#666" font-size="11" letter-spacing="2">STATE</text>
  <text x="700" y="38" fill="#666" font-size="11" letter-spacing="2">DATA</text>

  <rect x="50"  y="60"  width="180" height="64" rx="8" fill="#171717" stroke="#2a2a2a"/>
  <text x="140" y="88"  fill="#ededed" font-size="15" font-weight="500" text-anchor="middle">View</text>
  <text x="140" y="108" fill="#888"    font-size="11" text-anchor="middle">SwiftUI · pure function of state</text>

  <rect x="50"  y="200" width="180" height="78" rx="8" fill="#171717" stroke="#2a2a2a"/>
  <text x="140" y="226" fill="#ededed" font-size="15" font-weight="500" text-anchor="middle">ViewModel</text>
  <text x="140" y="245" fill="#888"    font-size="11" text-anchor="middle">@Observable @MainActor</text>
  <text x="140" y="263" fill="#888"    font-size="11" text-anchor="middle">sync reducer · send(_:Intent)</text>

  <rect x="340" y="130" width="200" height="78" rx="8" fill="#171717" stroke="#2a2a2a"/>
  <text x="440" y="156" fill="#ededed" font-size="15" font-weight="500" text-anchor="middle">@Observable State</text>
  <text x="440" y="175" fill="#888"    font-size="11" text-anchor="middle">Status: idle · loading · loaded</text>
  <text x="440" y="193" fill="#888"    font-size="11" text-anchor="middle">empty · failed · failedNullCoords</text>

  <rect x="650" y="60"  width="240" height="78" rx="8" fill="#171717" stroke="#2a2a2a"/>
  <text x="770" y="86"  fill="#ededed" font-size="15" font-weight="500" text-anchor="middle">Client</text>
  <text x="770" y="105" fill="#888"    font-size="11" text-anchor="middle">Sendable struct of</text>
  <text x="770" y="123" fill="#888"    font-size="11" text-anchor="middle">@Sendable async throws closures</text>

  <rect x="650" y="200" width="240" height="78" rx="8" fill="#171717" stroke="#2a2a2a"/>
  <text x="770" y="226" fill="#ededed" font-size="15" font-weight="500" text-anchor="middle">HTTPClient.executeJSON</text>
  <text x="770" y="245" fill="#888"    font-size="11" text-anchor="middle">log · send · cancel · decode</text>
  <text x="770" y="263" fill="#888"    font-size="11" text-anchor="middle">cancel · log · translate errors</text>

  <rect x="650" y="340" width="240" height="64" rx="8" fill="#171717" stroke="#2a2a2a"/>
  <text x="770" y="368" fill="#ededed" font-size="15" font-weight="500" text-anchor="middle">URLSession</text>
  <text x="770" y="388" fill="#888"    font-size="11" text-anchor="middle">.data(for: URLRequest)</text>

  <path d="M 140 124 L 140 200" stroke="#60a5fa" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue-d)"/>
  <text x="148" y="167" fill="#60a5fa" font-size="11">send Intent</text>

  <path d="M 230 232 L 340 175" stroke="#ededed" stroke-width="1.4" fill="none" marker-end="url(#arrow-d)"/>
  <text x="248" y="195" fill="#ededed" font-size="11">mutates</text>

  <path d="M 340 152 L 230 90" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow-back-d)"/>
  <text x="244" y="125" fill="#888" font-size="11">reads</text>

  <path d="M 230 220 L 650 100" stroke="#ededed" stroke-width="1.4" fill="none" marker-end="url(#arrow-d)"/>
  <text x="395" y="155" fill="#ededed" font-size="11">spawns Task</text>

  <path d="M 770 138 L 770 200" stroke="#60a5fa" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue-d)"/>
  <text x="780" y="172" fill="#60a5fa" font-size="11">executeJSON</text>

  <path d="M 770 278 L 770 340" stroke="#ededed" stroke-width="1.4" fill="none" marker-end="url(#arrow-d)"/>
  <text x="780" y="312" fill="#ededed" font-size="11">data(for:)</text>

  <path d="M 720 340 L 720 278" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow-back-d)"/>
  <path d="M 720 200 L 720 138" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow-back-d)"/>
  <text x="640" y="315" fill="#888" font-size="11" text-anchor="end">decoded</text>
  <text x="640" y="172" fill="#888" font-size="11" text-anchor="end">domain</text>

  <text x="50" y="438" fill="#666" font-size="11">Sync reducer mutates state; the only side effect is spawning a Task. Every async seam checks Task.checkCancellation().</text>
</svg>
